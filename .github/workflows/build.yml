name: Build and test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build GameBoost.sln --configuration Release
      - run: dotnet test tests/GameBoost.Tests --configuration Release --no-build
